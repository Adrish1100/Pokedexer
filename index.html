<!DOCTYPE html>
<html lang="en">
    <head>
<!-- Favicon -->
<link rel="icon" type="image/jpeg" href="./Favicon.jpg">
<link rel="apple-touch-icon" href="./Favicon.jpg">

<!-- Basic SEO -->
<title>PokéRegistry - Search Any Pokemon Instantly</title>
<meta name="description" content="A fast Pokedex to search and filter 1000+ Pokemon by name and type.">

<!-- Open Graph / Facebook / WhatsApp / Discord -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="PokéRegistry">
<meta property="og:title" content="PokéRegistry - Search Any Pokemon Instantly">
<meta property="og:description" content="A fast Pokedex to search and filter 1000+ Pokemon by name and type. Search Pikachu, Charizard and filter by Fire, Water, Grass types.">
<meta property="og:url" content="./index.html">

<!-- Main OG image (1200x630) -->
<meta property="og:image" content="./OG-img.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<!-- WhatsApp square image (1:1) - WhatsApp will pick this one -->
<meta property="og:image" content="./OG-whatsapp.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="800">
<meta property="og:image:height" content="800">

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="PokéRegistry - Search Any Pokemon Instantly">
<meta name="twitter:description" content="Search Pikachu, Charizard and filter by Fire, Water, Grass types.">
<meta name="twitter:image" content="./OG-img.jpg">
<meta name="twitter:creator" content="@pokeregistry">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body class="">
    <header>
        <h1>

    POKÉREGISTRY
    </h1>
    <section aria-label="search pokemons by name" class="search-by-name">
    <input type="text" autofocus="" id="pokemon-name" placeholder="Search by Name">
    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text-main)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
    </svg>
    </section>
    <svg role="button" tabindex="0" class="Hamburger-Menu-Button-open" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="var(--menu-buttons)" aria-label="Open Hamburger Menu" aria-controls="Hamburger-Menu-Panel" aria-expanded="false">
    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"></path>
  </svg> 
      </header>
      
    <section class="overlay" aria-hidden="true"></section>
    
<!-- The Filters Section -->
<aside aria-label="Filters" class="filters">
      <svg role="button" tabindex="0" class="Hamburger-Menu-Button-close" xmlns="http://www.w3.org/2000/svg" style="width: 40px; height: auto;" viewBox="0 0 24 24" fill="var(--menu-buttons)" stroke="var(--menu-buttons)" aria-label="Close Hamburger Menu" aria-controls="Hamburger-Menu-Panel">
      <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"></path>
    </svg>
  <h2>
    Filters
    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 16 16" fill="currentColor">
      <path d="M6 10.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5m-2-3a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5m-2-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5"></path>
    </svg>
  </h2>
     
<section>
  <h3>Primary Typing</h3>
  <label for="primary-type">Primary Type</label>
  <select id="primary-type" name="primary-type">
  <button>
    <selectedcontent></selectedcontent>
  </button>
  <option value="">None</option>
  <option value="normal" style="--clr:var(--type-normal)"><span aria-hidden="true">●</span> Normal</option>
  <option value="fire" style="--clr:orangered"><span aria-hidden="true">🔥</span> Fire</option>
  <option value="water" style="--clr:dodgerblue"><span aria-hidden="true">💧</span> Water</option>
  <option value="grass" style="--clr:green"><span aria-hidden="true">🌱</span> Grass</option>
  <option value="electric" style="--clr:gold"><span aria-hidden="true">⚡</span> Electric</option>
  <option value="ice" style="--clr:aquamarine"><span aria-hidden="true">❄</span> Ice</option>
  <option value="fighting" style="--clr:sienna"><span aria-hidden="true">✊</span> Fighting</option>
  <option value="poison" style="--clr:purple"><span aria-hidden="true">☢</span> Poison</option>
  <option value="ground" style="--clr:khaki"><span aria-hidden="true">⛰</span> Ground</option>
  <option value="flying" style="--clr:skyblue"><span aria-hidden="true">✈</span> Flying</option>
  <option value="psychic" style="--clr:rebeccapurple"><span aria-hidden="true">✨</span> Psychic</option>
  <option value="bug" style="--clr:yellowgreen"><span aria-hidden="true">🐛</span> Bug</option>
  <option value="rock" style="--clr:darkkhaki"><span aria-hidden="true">🪨</span> Rock</option>
  <option value="ghost" style="--clr:slateblue"><span aria-hidden="true">👻</span> Ghost</option>
  <option value="dragon" style="--clr:indigo"><span aria-hidden="true">🐉</span> Dragon</option>
  <option value="dark" style="--clr:darkslategray"><span aria-hidden="true">🌙</span> Dark</option>
  <option value="steel" style="--clr:slategray"><span aria-hidden="true">⚙</span> Steel</option>
  <option value="fairy" style="--clr:hotpink"><span aria-hidden="true">✦</span> Fairy</option>
</select>
</section>

<section>
  <h3>Secondary Typing</h3>
  <label for="secondary-type">Secondary Type</label>
  <select id="secondary-type" name="primary-type">
  <button>
    <selectedcontent></selectedcontent>
  </button>
  <option value="">None</option>
  <option value="normal" style="--clr:var(--type-normal)"><span aria-hidden="true">●</span> Normal</option>
  <option value="fire" style="--clr:orangered"><span aria-hidden="true">🔥</span> Fire</option>
  <option value="water" style="--clr:dodgerblue"><span aria-hidden="true">💧</span> Water</option>
  <option value="grass" style="--clr:green"><span aria-hidden="true">🌱</span> Grass</option>
  <option value="electric" style="--clr:gold"><span aria-hidden="true">⚡</span> Electric</option>
  <option value="ice" style="--clr:aquamarine"><span aria-hidden="true">❄</span> Ice</option>
  <option value="fighting" style="--clr:sienna"><span aria-hidden="true">✊</span> Fighting</option>
  <option value="poison" style="--clr:purple"><span aria-hidden="true">☢</span> Poison</option>
  <option value="ground" style="--clr:khaki"><span aria-hidden="true">⛰</span> Ground</option>
  <option value="flying" style="--clr:skyblue"><span aria-hidden="true">✈</span> Flying</option>
  <option value="psychic" style="--clr:rebeccapurple"><span aria-hidden="true">✨</span> Psychic</option>
  <option value="bug" style="--clr:yellowgreen"><span aria-hidden="true">🐛</span> Bug</option>
  <option value="rock" style="--clr:darkkhaki"><span aria-hidden="true">🪨</span> Rock</option>
  <option value="ghost" style="--clr:slateblue"><span aria-hidden="true">👻</span> Ghost</option>
  <option value="dragon" style="--clr:indigo"><span aria-hidden="true">🐉</span> Dragon</option>
  <option value="dark" style="--clr:darkslategray"><span aria-hidden="true">🌙</span> Dark</option>
  <option value="steel" style="--clr:slategray"><span aria-hidden="true">⚙</span> Steel</option>
  <option value="fairy" style="--clr:hotpink"><span aria-hidden="true">✦</span> Fairy</option>
</select>
</section>

<section>
  <h3>Generations</h3>
  <label for="gen-select">Select Generation</label>
  <select id="gen-select" class="gens" aria-label="All the Pokémon generations" name="generation">
    <option value="">All Gens</option>
    <option value="1" aria-label="Generation 1 (Kanto)" selected="">Gen I (Kanto)</option>
    <option value="2" aria-label="Generation 2 (Johto)">Gen II (Johto)</option>
    <option value="3" aria-label="Generation 3 (Hoenn)">Gen III (Hoenn)</option>
    <option value="4" aria-label="Generation 4 (Sinnoh)">Gen IV (Sinnoh)</option>
    <option value="5" aria-label="Generation 5 (Unova)">Gen V (Unova)</option>
    <option value="6" aria-label="Generation 6 (Kalos)">Gen VI (Kalos)</option>
    <option value="7" aria-label="Generation 7 (Alola)">Gen VII (Alola)</option>
    <option value="8" aria-label="Generation 8 (Galar)">Gen VIII (Galar)</option>
    <option value="9" aria-label="Generation 9 (Paldea)">Gen IX (Paldea)</option>
  </select>
</section>
    
  <section aria-label="Filter-Buttons">
      <button type="button" id="reset-button">
        <span style="font-weight:bold;">↻</span> Reset
</button>
    
    <button id="apply-button">reload
</button>
  </section>
 
  <section class="light-dark-toggle-section">
      <h4>Light/Dark Mode</h4>
      <button aria-label="Light/Dark Mode toggle" id="toggle">
      <div class="circle"></div>
  </button>
  </section>
   <p class="blue">&#9889; Fast • Interactive • Real Time</p>
  </aside>
  
   <main>
      <h2 id="number-of-pokemons">
      Welcome To PokéRegistry!
      </h2>
      <ul id="pokemonList"></ul>
      
      <section aria-label="Pokémon navigation" class="pokenav">
         <button id="prev" aria-label="Previous Pokémon">←</button>
         <button id="next" aria-label="Next Pokémon">→</button>
       </section>
  </main>
  
 <footer>
  <p>Data from <a href="https://pokeapi.co/" target="_blank" rel="noopener">PokéAPI</a></p>
  
  <p>Built by Adrish &amp; Shreyansh • Not affiliated with Nintendo / Game Freak</p>
  <p>© 2026 Pokédex Project</p>
</footer>

<script src="script.js"></script>

</body>
</html>
